name: Deploy Schema to RDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Debug secrets (safe output)
        run: |
          echo "HOST=${{ secrets.RDS_HOST }}"
          echo "PORT=${{ secrets.RDS_PORT }}"
          echo "DB=${{ secrets.RDS_DB }}"
          echo "USER=${{ secrets.RDS_USER }}"

      - name: Apply schema to RDS
        env:
          PGPASSWORD: ${{ secrets.RDS_PASSWORD }}
        run: |
          psql \
            "host=${{ secrets.RDS_HOST }} \
             port=${{ secrets.RDS_PORT }} \
             dbname=${{ secrets.RDS_DB }} \
             user=${{ secrets.RDS_USER }}" \
            -f supabase/migrations/00000000000001_initial_schema.sql
